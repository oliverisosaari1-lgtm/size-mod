name: Build size mod
on:
  push:
    paths-ignore: ['smp-mod/**', '.github/workflows/smp.yml', 'duel-mod/**', '.github/workflows/duel.yml', 'spider-mod/**', '.github/workflows/spider.yml', 'walk-mod/**', '.github/workflows/walk.yml', 'illusion-mod/**', '.github/workflows/illusion.yml', 'break-mod/**', '.github/workflows/break.yml', 'pvp-mod/**', '.github/workflows/pvp.yml', 'morph-mod/**', '.github/workflows/morph.yml', 'timestop-mod/**', '.github/workflows/timestop.yml', 'cloak-mod/**', '.github/workflows/cloak.yml', 'enchant-mod/**', '.github/workflows/enchant.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: size-mod
          path: build/libs/*.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          API_JAR="fabric-api-$API.jar"
          curl -sSfL -o "$API_JAR" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/$API_JAR"
          mkdir -p "zip/Size Mod 1.21.11/minecraft/mods"
          cp pack/* "zip/Size Mod 1.21.11/"
          cp "$JAR" "$API_JAR" "zip/Size Mod 1.21.11/minecraft/mods/"
          (cd zip && zip -qr ../SizeMod-Prism-1.21.11.zip "Size Mod 1.21.11")
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SizeMod-Prism-1.21.11.zip "$JAR" "$API_JAR" --title "Size Mod for Minecraft 1.21.11" --notes "Easiest: download SizeMod-Prism-1.21.11.zip and import it in Prism (Add Instance, Import). Or download both .jar files (size-mod and fabric-api) and add them to your Fabric 1.21.11 mods folder."
