name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Find latest Fabric versions for 1.21.11
        run: |
          MC=1.21.11
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          API=$(curl -s https://api.modrinth.com/v2/project/fabric-api/version | jq -r --arg mc "$MC" '[.[]|select(.game_versions|index($mc))][0].version_number')
          echo "loader=$LOADER api=$API"
          sed -i "s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$API/" gradle.properties
          cat gradle.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: size-mod
          path: build/libs/*.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Size Mod for Minecraft 1.21.11" --notes "Download the .jar and put it in your mods folder. Needs Fabric API."
