name: Build DonutSMP mod
on:
  push:
    paths: ['smp-mod/**', '.github/workflows/smp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smp-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Light blue inventory and chest textures
        run: |
          JAR=$(find ~/.gradle/caches -name 'minecraft-merged*.jar' | grep -v sources | head -1)
          rm -rf /tmp/mc && mkdir -p /tmp/mc && cd /tmp/mc && unzip -q "$JAR" 'assets/minecraft/textures/gui/container/*'
          pip install --quiet pillow
          python3 "$GITHUB_WORKSPACE/smp-mod/tint_gui.py" /tmp/mc/assets/minecraft/textures/gui/container "$GITHUB_WORKSPACE/smp-mod/src/main/resources/assets/minecraft/textures/gui/container"
          cd "$GITHUB_WORKSPACE/smp-mod" && gradle build
      - name: Check mixin targets exist
        run: |
          JAR=$(find ~/.gradle/caches -name 'minecraft-merged*.jar' | grep -v sources | head -1)
          javap -p -cp "$JAR" net.minecraft.client.Camera | grep -q 'float calculateFov(float)' && echo "Camera.calculateFov OK"
          javap -p -cp "$JAR" net.minecraft.client.gui.screens.Screen | grep -q 'extractPanorama' && echo "Screen.extractPanorama OK"
          javap -p -cp "$JAR" net.minecraft.client.MouseHandler | grep -q 'void onScroll(long, double, double)' && echo "MouseHandler.onScroll OK"
      - name: Show Minecraft API (debug)
        if: failure()
        run: |
          JAR=$(find ~/.gradle/caches -name 'minecraft-merged*.jar' | grep -v sources | head -1)
          CP="$JAR:$(find ~/.gradle/caches -name 'fabric-*.jar' | grep -v sources | tr '\n' ':')"
          unzip -l "$JAR" | grep -iE 'client/gui/[A-Za-z]*Graphics|client/gui/Gui[A-Z][A-Za-z]*\.class' | head -20
          javap -cp "$CP" net.minecraft.client.Options | grep -iE 'boolean hide' || true
          unzip -l "$JAR" | grep -iE 'fov|Fov' | head
          for c in net.minecraft.client.Camera net.minecraft.client.renderer.GameRenderer net.minecraft.client.renderer.LevelRenderer; do javap -p -cp "$CP" $c | grep -iE 'fov' ; done
          for j in $(find ~/.gradle/caches -name 'fabric-key*.jar' | grep -v sources | head -1); do unzip -l $j | grep class; done
          curl -s 'https://api.modrinth.com/v2/project/simple-voice-chat/version?loaders=%5B%22fabric%22%5D' | jq -r '.[0:5][]|.version_number+" "+(.game_versions|join(","))+" "+([.files[]|select(.primary)][0].filename)'
          for c in $(cat debug-classes.txt 2>/dev/null); do echo "=== $c"; javap -cp "$CP" "$c" || true; done
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          SODIUM=$(grep '^sodium_version=' gradle.properties | cut -d= -f2)
          API_JAR="fabric-api-$API.jar"
          SODIUM_JAR="sodium-fabric-$SODIUM.jar"
          curl -sSfL -o "$API_JAR" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/$API_JAR"
          SODIUM_URL=$(curl -sSf 'https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D' | jq -r --arg v "$SODIUM" '[.[].files[] | select(.primary and (.filename == "sodium-fabric-\($v).jar"))][0].url')
          echo "sodium: $SODIUM_URL"
          curl -sSfL -o "$SODIUM_JAR" "$SODIUM_URL"
          VC_URL=$(curl -sSf 'https://api.modrinth.com/v2/project/simple-voice-chat/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D' | jq -r '[.[0].files[] | select(.primary)][0].url')
          VC_JAR=$(basename "$VC_URL")
          echo "voicechat: $VC_URL"
          curl -sSfL -o "$VC_JAR" "$VC_URL"
          DIR="zip/DonutSMP Mod 26.3"
          mkdir -p "$DIR/minecraft/mods"
          cp pack/* "$DIR/"
          cp "$JAR" "$API_JAR" "$SODIUM_JAR" "$VC_JAR" "$DIR/minecraft/mods/"
          (cd zip && zip -qr ../DonutSMP-Mod-Prism-26.3.zip "DonutSMP Mod 26.3")
          gh release delete donutsmp -y --cleanup-tag || true
          gh release create donutsmp DonutSMP-Mod-Prism-26.3.zip "$JAR" "$API_JAR" "$SODIUM_JAR" "$VC_JAR" --title "DonutSMP Mod for Minecraft 26.3" --notes "Easiest: download DonutSMP-Mod-Prism-26.3.zip and import it in Prism (Add Instance, Import). Needs Fabric API, Sodium and Simple Voice Chat (all included)."
