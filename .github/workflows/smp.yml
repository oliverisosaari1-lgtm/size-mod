name: Build DonutSMP mod
on:
  push:
    paths: ['smp-mod/**', '.github/workflows/smp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smp-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Show Minecraft API (debug)
        if: failure()
        run: |
          JAR=$(find ~/.gradle/caches ../smp-mod/.gradle -name 'minecraft-merged*.jar' -o -name 'minecraft-common*.jar' 2>/dev/null | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches -path '*minecraft*' -name '*.jar' -size +10M | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR" | grep -E 'world/inventory/(Click|Container)[A-Za-z]*\.class' || true
          javap -cp "$JAR" net.minecraft.world.inventory.AbstractContainerMenu | grep -iE 'clicked|click' || true
          javap -cp "$JAR" net.minecraft.util.Prediction || true
          javap -cp "$JAR" net.minecraft.world.entity.player.Inventory | grep -iE "placeItemBack|add\(" || true
          javap -cp "$JAR" net.minecraft.world.item.Items | grep -E 'GLASS_PANE|_DYE' | head -8 || true
          javap -cp "$JAR" net.minecraft.world.entity.player.Player | grep -E ' drop' || true
          javap -cp "$JAR" net.minecraft.world.entity.LivingEntity | grep -E ' drop' || true
          javap -cp "$JAR" net.minecraft.server.level.ServerPlayer | grep -E ' drop|teleportTo|sendSystemMessage' || true
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          SODIUM=$(grep '^sodium_version=' gradle.properties | cut -d= -f2)
          API_JAR="fabric-api-$API.jar"
          SODIUM_JAR="sodium-fabric-$SODIUM.jar"
          curl -sSfL -o "$API_JAR" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/$API_JAR"
          SODIUM_URL=$(curl -sSf 'https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D' | jq -r --arg v "$SODIUM" '[.[].files[] | select(.primary and (.filename == "sodium-fabric-\($v).jar"))][0].url')
          echo "sodium: $SODIUM_URL"
          curl -sSfL -o "$SODIUM_JAR" "$SODIUM_URL"
          DIR="zip/DonutSMP Mod 26.3"
          mkdir -p "$DIR/minecraft/mods"
          cp pack/* "$DIR/"
          cp "$JAR" "$API_JAR" "$SODIUM_JAR" "$DIR/minecraft/mods/"
          (cd zip && zip -qr ../DonutSMP-Mod-Prism-26.3.zip "DonutSMP Mod 26.3")
          gh release delete donutsmp -y --cleanup-tag || true
          gh release create donutsmp DonutSMP-Mod-Prism-26.3.zip "$JAR" "$API_JAR" "$SODIUM_JAR" --title "DonutSMP Mod for Minecraft 26.3" --notes "Easiest: download DonutSMP-Mod-Prism-26.3.zip and import it in Prism (Add Instance, Import). Needs Fabric API and Sodium (both included)."
