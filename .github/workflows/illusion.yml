name: Build Illusion mod
on:
  push:
    paths: ['illusion-mod/**', '.github/workflows/illusion.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: illusion-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          mkdir -p out && cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../Illusion-Mod.zip *.jar)
          gh release delete illusion -y --cleanup-tag || true
          gh release create illusion "$JAR" Illusion-Mod.zip --title "Illusion Mod" --notes "Illusion Mod for Fabric 1.21.11 (needs Fabric API)"
