name: Test Olkkus Client launcher
on:
  push:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.3", loader: fabric, boost: "1", olkku: "1" }
          - { mc: "26.3", loader: vanilla }
          - { mc: "1.21.11", loader: quilt }
          - { mc: "1.21.1", loader: neoforge }
          - { mc: "1.20.1", loader: forge }
          - { mc: "1.12.2", loader: liteloader }
          - { mc: "1.8.9", loader: vanilla }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libgl1 libglx-mesa0 libopenal1 > /dev/null
      - name: Install and start Minecraft
        working-directory: launcher
        env:
          OLKKU_CLIENT_DIR: /tmp/olkku
          BOOST: ${{ matrix.boost }}
          OLKKU: ${{ matrix.olkku }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          go build -o olc .
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./olc test "${{ matrix.mc }}" "${{ matrix.loader }}" 100 2>&1 | tail -90
          ls /tmp/olkku/instances/*/mods 2>/dev/null || true
