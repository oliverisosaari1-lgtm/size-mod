name: Build Morph mod
on:
  push:
    paths: ['morph-mod/**', '.github/workflows/morph.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morph-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Check mixin target exists
        run: |
          JAR=$(find ~/.gradle/caches .gradle -path '*minecraft*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/renderer/entity/EntityRenderDispatcher.class" && echo "{}"' | head -1)
          echo "JAR=$JAR"
          javap -p -cp "$JAR" net.minecraft.client.renderer.entity.EntityRenderDispatcher | grep extractEntity
          javap -p -cp "$JAR" net.minecraft.client.renderer.entity.EntityRenderDispatcher | grep -q 'extractEntity(E, float)'
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          mkdir -p out && cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../Morph-Mod.zip *.jar)
          gh release delete morph -y --cleanup-tag || true
          gh release create morph "$JAR" Morph-Mod.zip --title "Morph Mod" --notes "Morph Mod for Fabric 1.21.11 (needs Fabric API)"
