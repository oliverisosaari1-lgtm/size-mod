name: Build underground base world
on:
  push:
    paths: ['base-world/**', '.github/workflows/baseworld.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build the world with a 26.3 server
        run: |
          cd base-world && python3 build.py
          V=$(curl -sSf https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[]|select(.id=="26.3").url')
          URL=$(curl -sSf "$V" | jq -r '.downloads.server.url')
          mkdir -p /tmp/w && cd /tmp/w && curl -sSfL -o server.jar "$URL"
          echo eula=true > eula.txt
          cat > server.properties <<'P'
          online-mode=false
          level-name=Underground Base
          level-type=minecraft\:flat
          generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:stone","height"\:59},{"block"\:"minecraft\:dirt","height"\:4},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:plains"}
          generate-structures=false
          spawn-protection=0
          spawn-monsters=true
          gamemode=survival
          P
          sed -i 's/^ *//' server.properties
          CMDS=$GITHUB_WORKSPACE/base-world/commands.txt
          {
            for i in $(seq 1 200); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done
            echo "forceload add -48 -48 48 48"; sleep 15
            cat "$CMDS"; sleep 5
            echo "execute if block 0 0 20 minecraft:grass_block run say CHECK ground ok"
            echo "execute if block 0 -5 0 minecraft:oak_planks run say CHECK floor ok"
            echo "execute if block 0 -1 -10 minecraft:nether_portal run say CHECK portal ok"
            echo "execute if block -10 -4 0 minecraft:red_bed run say CHECK bed ok"
            echo "execute if block 7 -4 0 minecraft:enchanting_table run say CHECK enchant ok"
            echo "execute if entity @e[type=painting] run say CHECK painting ok"
            echo "execute if block 11 1 4 minecraft:polished_blackstone run say CHECK rim ok"
            sleep 3; echo "forceload remove all"; echo "save-all flush"; sleep 10; echo stop; sleep 20
          } | timeout 900 java -Xmx2G -jar server.jar nogui > out.txt 2>&1 || true
          grep -i 'CHECK\|error\|unknown\|incorrect\|expected' out.txt | head -60
          grep -c 'CHECK' out.txt
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/w && rm -f "Underground Base/session.lock" && zip -qr "$GITHUB_WORKSPACE/Underground-Base-26.3.zip" "Underground Base"
          cd $GITHUB_WORKSPACE && ls -la Underground-Base-26.3.zip
          gh release delete basewold -y --cleanup-tag || true
          gh release delete baseworld -y --cleanup-tag || true
          gh release create baseworld Underground-Base-26.3.zip --title "Underground Base world" --notes "Minecraft 26.3 world"
