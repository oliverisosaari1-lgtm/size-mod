name: Build Duel mod
on:
  push:
    paths: ['duel-mod/**', '.github/workflows/duel.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duel-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          mkdir -p out && cp "$JAR" out/ && (cd out && zip -q ../Duel-Mod.zip *.jar)
          gh release delete duelmod -y --cleanup-tag || true
          gh release create duelmod "$JAR" Duel-Mod.zip --title "Duel Mod" --notes "Duel Mod for Fabric 26.3 (needs Fabric API)"
