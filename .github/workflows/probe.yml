name: Probe versions
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== game versions"; curl -s https://meta.fabricmc.net/v2/versions/game | jq -r '.[0:8][]|.version+" stable="+(.stable|tostring)'
          echo "== loader"; curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0:3][]|.version'
          echo "== loom"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
          echo "== fabric-api"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
          echo "== sodium"; curl -s 'https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D' | jq -r '.[0:6][]|.version_number+" "+(.game_versions|join(","))+" "+.files[0].url'
          echo "== fabric example mod gradle"; curl -s https://raw.githubusercontent.com/FabricMC/fabric-example-mod/HEAD/build.gradle; curl -s https://raw.githubusercontent.com/FabricMC/fabric-example-mod/HEAD/gradle.properties; curl -s https://raw.githubusercontent.com/FabricMC/fabric-example-mod/HEAD/gradle/wrapper/gradle-wrapper.properties
