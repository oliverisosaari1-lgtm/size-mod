name: Build Olkkus Practice mod
on:
  push:
    paths: ['practice-mod/**', '.github/workflows/practice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Mod icon (netherite sword) and mixin target check
        run: |
          MC=$(find ~/.gradle/caches .gradle -path '*1.21.11*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "assets/minecraft/textures/item/netherite_sword.png" && echo "{}"' | head -1)
          echo "MC=$MC"
          unzip -p "$MC" assets/minecraft/textures/item/netherite_sword.png > /tmp/sword.png
          ffmpeg -v error -y -i /tmp/sword.png -vf scale=128:128:flags=neighbor src/main/resources/assets/olkkuspractice/icon.png || cp /tmp/sword.png src/main/resources/assets/olkkuspractice/icon.png
          CL=$(find ~/.gradle/caches .gradle -path '*1.21.11*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/renderer/GameRenderer.class" && echo "{}"' | head -1)
          javap -p -cp "$CL" net.minecraft.client.renderer.GameRenderer | grep getFov || echo "NO getFov"
          javap -p -cp "$CL" net.minecraft.client.gui.screens.Screen | grep -i "panorama\|background" || echo "NO renderPanorama"
          javap -p -cp "$CL" net.minecraft.client.renderer.GameRenderer | grep -i "fov" || true
          echo "CL=$CL"
      - name: Make the practice world (start a server once)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2)
          INSTALLER=$(curl -sSf https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[]|select(.stable)][0].version')
          mkdir -p /tmp/st/mods && cp "$JAR" /tmp/st/mods/
          curl -sSfL -o "/tmp/st/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          curl -sSfL -o /tmp/st/server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/$LOADER/$INSTALLER/server/jar"
          cd /tmp/st && echo eula=true > eula.txt && printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\ndifficulty=normal\n' > server.properties
          { for i in $(seq 1 150); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done; echo stop; sleep 15; } | timeout 400 java -Xmx2G -jar server.jar nogui > out.txt 2>&1 || true
          tail -15 out.txt
          grep -q 'Done (' out.txt || { echo "SERVER DID NOT START"; exit 1; }
          cd world && rm -rf playerdata session.lock stats advancements && echo "Olkku's Practice world" > olkku_practice.txt
          zip -qr "$GITHUB_WORKSPACE/practice-mod/src/main/resources/assets/olkkuspractice/practice_world.zip" .
          ls -la "$GITHUB_WORKSPACE/practice-mod/src/main/resources/assets/olkkuspractice/"
      - name: Build again with the world and icon inside
        run: gradle build --stacktrace
      - name: Test that the practice world starts with the mod
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          rm -rf /tmp/st2 && mkdir -p /tmp/st2/mods && cp "$JAR" /tmp/st/mods/fabric-api.jar /tmp/st2/mods/ && cp /tmp/st/server.jar /tmp/st/eula.txt /tmp/st/server.properties /tmp/st2/
          mkdir -p /tmp/st2/world && (cd /tmp/st2/world && unzip -q "$GITHUB_WORKSPACE/practice-mod/src/main/resources/assets/olkkuspractice/practice_world.zip")
          cd /tmp/st2 && { for i in $(seq 1 150); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done; echo stop; sleep 15; } | timeout 400 java -Xmx2G -jar server.jar nogui > out.txt 2>&1 || true
          tail -20 out.txt
          grep -q 'Done (' out.txt || { echo "SERVER DID NOT START"; exit 1; }
      - name: Get Sodium and Essential
        run: |
          mkdir -p out
          for P in sodium essential; do
            URL=$(curl -sSf "https://api.modrinth.com/v2/project/$P/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url')
            echo "$P -> $URL"
            [ "$URL" != "null" ] && curl -sSfL -o "out/$(basename "$URL" | sed 's/%2B/+/g')" "$URL" || echo "could not get $P"
          done
          for f in out/*.jar; do echo "$f: $(unzip -p "$f" fabric.mod.json | jq -r .id)"; done
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../Olkkus-Practice.zip *.jar)
          gh release delete practice -y --cleanup-tag || true
          gh release create practice "$JAR" Olkkus-Practice.zip --title "Olkku's Practice" --notes "Olkku's Practice for Fabric 1.21.11 (with Fabric API, Sodium, Essential)"
