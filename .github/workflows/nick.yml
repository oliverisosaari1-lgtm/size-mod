name: Build Nick mod
on:
  push:
    paths: ['nick-mod/**', '.github/workflows/nick.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nick-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Probe
        run: |
          CL=$(find ~/.gradle/caches .gradle -path '*1.21.11*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/renderer/GameRenderer.class" && echo "{}"' | head -1)
          AL=$(find ~/.gradle/caches -name 'authlib-*.jar' | grep -v sources | head -1); echo $AL
          for c in 'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Entry' net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket net.minecraft.network.protocol.game.ClientboundPlayerInfoRemovePacket 'net.minecraft.server.level.ChunkMap$TrackedEntity' com.mojang.authlib.GameProfile com.mojang.authlib.properties.PropertyMap com.mojang.authlib.properties.Property; do echo "== $c"; javap -p -cp "$CL:$AL" "$c" 2>&1 | head -45; done
          javap -p -cp "$CL:$AL" net.minecraft.world.entity.player.Player | grep -i 'name\|profile'
          javap -p -c -cp "$CL:$AL" 'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Entry' | grep -A30 'Entry(net.minecraft.server.level.ServerPlayer)' | grep invoke
          javap -p -cp "$CL:$AL" net.minecraft.client.multiplayer.PlayerInfo | head -30
