name: Build Spider-Man mod
on:
  push:
    paths: ['spider-mod/**', '.github/workflows/spider.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spider-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          mkdir -p out && cp "$JAR" out/ && (cd out && zip -q ../Spider-Man-Mod.zip *.jar)
          gh release delete spiderman -y --cleanup-tag || true
          gh release create spiderman "$JAR" Spider-Man-Mod.zip --title "Spider-Man Mod" --notes "Spider-Man Mod for Fabric 1.21.11 (needs Fabric API)"
