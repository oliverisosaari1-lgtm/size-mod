name: Build Olkkus Client mod
on:
  push:
    paths: ['client-mod/**', '.github/workflows/client.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" olkkus-client-26.3.jar
          gh release delete olkkuclient -y --cleanup-tag || true
          gh release create olkkuclient olkkus-client-26.3.jar --title "Olkku's Client in-game mod" --notes "Fabric 26.3"
