name: Build Move mod 26.3
on:
  push:
    paths: ['move-mod-26/**', '.github/workflows/move26.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move-mod-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Check animation hook targets
        run: |
          CL=$(find ~/.gradle/caches .gradle -path '*26.3*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/renderer/GameRenderer.class" && echo "{}"' | head -1)
          javap -p -s -cp "$CL" net.minecraft.client.renderer.entity.LivingEntityRenderer > lr.txt
          grep -q '(Lnet/minecraft/client/renderer/entity/state/LivingEntityRenderState;Lcom/mojang/blaze3d/vertex/PoseStack;Lnet/minecraft/client/renderer/SubmitNodeCollector;Lnet/minecraft/client/renderer/state/level/CameraRenderState;)V' lr.txt
          grep -q '(Lnet/minecraft/client/renderer/entity/state/LivingEntityRenderState;Lcom/mojang/blaze3d/vertex/PoseStack;FF)V' lr.txt
          javap -p -s -cp "$CL" net.minecraft.client.model.player.PlayerModel | grep -q '(Lnet/minecraft/client/renderer/entity/state/AvatarRenderState;)V'
          javap -p -cp "$CL" net.minecraft.client.renderer.entity.player.AvatarRenderer | grep setupRotations
          javap -p -c -cp "$CL" net.minecraft.client.renderer.entity.player.AvatarRenderer | grep -A40 'void setupRotations(net.minecraft.client.renderer.entity.state.AvatarRenderState' | grep -i 'invokespecial\|return' | head
          javap -p -s -cp "$CL" net.minecraft.world.entity.player.Player | grep -A1 'updatePlayerPose'
          javap -p -s -cp "$CL" net.minecraft.client.model.HumanoidModel | grep -q '(Lnet/minecraft/client/renderer/entity/state/HumanoidRenderState;)V'
          javap -p -cp "$CL" net.minecraft.world.entity.player.Player | grep causeFallDamage
          echo HOOKS OK
      - name: Test that a server starts with the mod (mixins load)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2)
          INSTALLER=$(curl -sSf https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[]|select(.stable)][0].version')
          mkdir -p /tmp/st/mods && cp "$JAR" /tmp/st/mods/
          curl -sSfL -o "/tmp/st/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          curl -sSfL -o /tmp/st/server.jar "https://meta.fabricmc.net/v2/versions/loader/26.3/$LOADER/$INSTALLER/server/jar"
          cd /tmp/st && echo eula=true > eula.txt && printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > server.properties
          { for i in $(seq 1 150); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done; echo stop; sleep 15; } | timeout 400 java -Xmx2G -jar server.jar nogui > out.txt 2>&1 || true
          tail -25 out.txt
          grep -q 'Done (' out.txt || { echo "SERVER DID NOT START"; exit 1; }
          ! grep -qi 'mixin.*\(error\|fail\)' out.txt || { echo "MIXIN PROBLEM"; exit 1; }
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          mkdir -p out && cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../Sit-Move-Mod-26.3.zip *.jar)
          gh release delete move26 -y --cleanup-tag || true
          gh release create move26 "$JAR" Sit-Move-Mod-26.3.zip --title "Sit and Move Mod" --notes "Sit and Move Mod for Fabric 26.3 (needs Fabric API)"
