name: Build PvP Menu mod
on:
  push:
    paths: ['pvp-mod/**', '.github/workflows/pvp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pvp-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Check mixin target
        run: |
          JAR=$(find ~/.gradle/caches .gradle -name 'minecraft-*merged*named*.jar' -o -name 'minecraft-client*named*.jar' 2>/dev/null | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches .gradle -path '*minecraft*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/client/renderer/ItemInHandRenderer.class" && echo "{}"' | head -1)
          echo "JAR=$JAR"
          javap -c -p -cp "$JAR" net.minecraft.client.renderer.ItemInHandRenderer | awk '/renderArmWithItem\(/{f=1} f&&/pushPose/{print "PUSHPOSE FOUND"; exit} f&&/^  [a-z].*\(/&&!/renderArmWithItem/{f=0}'
          javap -p -cp "$JAR" net.minecraft.client.renderer.ItemInHandRenderer | grep renderArmWithItem
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          mkdir -p out && cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../PvP-Menu-Mod.zip *.jar)
          gh release delete pvpmenu -y --cleanup-tag || true
          gh release create pvpmenu "$JAR" PvP-Menu-Mod.zip --title "PvP Menu" --notes "PvP Menu for Fabric 1.21.11 (needs Fabric API)"
