name: Build Move mod
on:
  push:
    paths: ['move-mod/**', '.github/workflows/move.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build --stacktrace
      - name: Test that a server starts with the mod (mixins load)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2)
          INSTALLER=$(curl -sSf https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[]|select(.stable)][0].version')
          mkdir -p /tmp/st/mods && cp "$JAR" /tmp/st/mods/
          curl -sSfL -o "/tmp/st/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          curl -sSfL -o /tmp/st/server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/$LOADER/$INSTALLER/server/jar"
          cd /tmp/st && echo eula=true > eula.txt && printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > server.properties
          { for i in $(seq 1 150); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done; echo stop; sleep 15; } | timeout 400 java -Xmx2G -jar server.jar nogui > out.txt 2>&1 || true
          tail -25 out.txt
          grep -q 'Done (' out.txt || { echo "SERVER DID NOT START"; exit 1; }
          ! grep -qi 'mixin.*\(error\|fail\)' out.txt || { echo "MIXIN PROBLEM"; exit 1; }
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          mkdir -p out && cp "$JAR" out/
          curl -sSfL -o "out/fabric-api-$API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          (cd out && zip -q ../Sit-Move-Mod.zip *.jar)
          gh release delete move -y --cleanup-tag || true
          gh release create move "$JAR" Sit-Move-Mod.zip --title "Sit and Move Mod" --notes "Sit and Move Mod for Fabric 1.21.11 (needs Fabric API)"
